
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Live</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1f2937;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 16px;
            color: #4ade80;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        p {
            color: #9ca3af;
            font-size: 18px;
        }

        @keyframes pulse {
            50% {
                opacity: 0.3;
                transform: scale(1.4);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status">
            <span class="dot"></span>
            LIVE
        </div>

        <h1>I Am Live & Working</h1>
        <p>Everything is up and running.</p>
    </div>
</body>
</html>
